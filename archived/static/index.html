<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayShield Guardian - Payment Security</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛡️ PayShield Guardian</h1>
            <p>Intelligent payment security analysis</p>
        </header>

        <main>
            <!-- Payment Form -->
            <section id="payment-form-section" class="section">
                <h2>Submit Payment Request</h2>
                <form id="payment-form">
                    <div class="form-group">
                        <label for="sender-id">Your ID:</label>
                        <input type="text" id="sender-id" name="sender_id" required placeholder="e.g., USER123">
                    </div>

                    <div class="form-group">
                        <label for="recipient-name">Recipient Name:</label>
                        <input type="text" id="recipient-name" name="recipient_name" required placeholder="e.g., John Doe">
                    </div>

                    <div class="form-group">
                        <label for="recipient-id">Recipient ID:</label>
                        <input type="text" id="recipient-id" name="recipient_id" required placeholder="e.g., GOOG or new-recipient-id">
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount ($):</label>
                        <input type="number" id="amount" name="amount" required step="0.01" placeholder="100.00">
                    </div>

                    <div class="form-group">
                        <label for="note">Payment Note:</label>
                        <textarea id="note" name="note" rows="3" placeholder="Optional: purpose of payment"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Analyze Payment</button>
                </form>
            </section>

            <!-- Risk Analysis Result -->
            <section id="risk-result-section" class="section hidden">
                <h2>Risk Assessment Result</h2>
                <div id="risk-display"></div>
            </section>

            <!-- Confirmation Dialog -->
            <section id="confirmation-section" class="section hidden">
                <h2>Confirm Payment</h2>
                <div id="confirmation-content"></div>
            </section>

            <!-- Audit History -->
            <section id="audit-section" class="section">
                <h2>Recent Transactions</h2>
                <button id="refresh-audit-btn" class="btn btn-secondary">Refresh</button>
                <div id="audit-list"></div>
            </section>
        </main>

        <footer>
            <p>&copy; 2025 PayShield Guardian. Powered by intelligent risk analysis.</p>
        </footer>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
